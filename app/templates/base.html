<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}审核时点特征{% endblock %}</title>
<style>
  :root {
    --bg:#f5f7fa; --card:#fff; --ink:#1c2733; --muted:#5d6b7a;
    --line:#dde4ec; --accent:#1857a4; --accent-ink:#fff;
    --ok:#126b3f; --ok-bg:#e6f4ec; --bad:#a41c1c; --bad-bg:#fdeaea;
    --warn:#8a5a00; --warn-bg:#fff6df;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",
         "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); background:var(--bg); }
  header.top { background:#10243a; color:#fff; padding:18px 0; }
  .wrap { width:min(1180px,94vw); margin:0 auto; }
  header.top .wrap { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header.top h1 { font-size:19px; margin:0; font-weight:600; letter-spacing:.02em; }
  header.top .sub { color:#a9bdd2; font-size:13px; }
  main { padding:26px 0 60px; }
  h2 { font-size:17px; margin:0 0 12px; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:860px) { .cards { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:18px 20px; }
  .card p.hint { color:var(--muted); font-size:13px; margin:6px 0 14px; }
  .card form { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=file] { font-size:13px; max-width:100%; }
  button { font:inherit; font-size:14px; border:1px solid transparent;
           background:var(--accent); color:var(--accent-ink); padding:8px 16px;
           border-radius:7px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button.secondary { background:#fff; color:var(--accent);
                     border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .banner { border-radius:8px; padding:10px 14px; margin-bottom:16px;
            font-size:14px; white-space:pre-wrap; }
  .banner.error { background:var(--bad-bg); color:var(--bad);
                  border:1px solid #f2c4c4; }
  .banner.notice { background:var(--ok-bg); color:var(--ok);
                   border:1px solid #bfe3cd; }
  .banner.info { background:#eaf1fa; color:#24486f; border:1px solid #cfdff2; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { color:var(--muted); font-weight:600; background:#fafbfd; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
                font-size:12.5px; word-break:break-all; }
  .pill { display:inline-block; padding:1px 9px; border-radius:999px;
          font-size:12px; font-weight:600; }
  .pill.ready { background:var(--ok-bg); color:var(--ok); }
  .pill.pending, .pill.running { background:var(--warn-bg); color:var(--warn); }
  .pill.failed { background:var(--bad-bg); color:var(--bad); }
  .scroll { overflow:auto; max-height:62vh; border:1px solid var(--line);
            border-radius:8px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
             margin-bottom:14px; }
  .toolbar .spacer { flex:1; }
  .kv { display:grid; grid-template-columns:190px 1fr; gap:6px 16px;
        font-size:13.5px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; }
  a { color:var(--accent); }
  .empty { color:var(--muted); font-size:14px; padding:8px 0; }
  details summary { cursor:pointer; color:var(--accent); font-size:13px; }
  .manifest { max-height:280px; overflow:auto; }
  .sticky-note { font-size:12.5px; color:var(--muted); }
  td.nw { white-space:nowrap; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>交易修订 · 审核时点特征</h1>
    <span class="sub">Point-in-time features · UTC 秒 · 截止审核时刻可见版本</span>
  </div>
</header>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
</body>
</html>
